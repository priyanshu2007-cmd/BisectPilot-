name: Publish Package

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate without publishing)"
        required: true
        type: boolean
        default: false
      registry:
        description: "Target registry ('npm' or 'github')"
        required: false
        default: "github"
  workflow_call:
    inputs:
      dry_run:
        description: "Dry run (validate without publishing)"
        required: false
        type: boolean
        default: false
      registry:
        description: "Target registry ('npm' or 'github')"
        required: false
        type: string
        default: "github"
    secrets:
      NPM_TOKEN:
        description: "npm access token for publishing to registry.npmjs.org"
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate-and-publish:
    name: Validate and Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@priyanshu2007-cmd"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and run test suite
        run: |
          npm run build
          npm run typecheck
          npm test
          npm run test:py
          node --test dist/tests/integration/package-distribution.test.js

      - name: Verify package version and metadata
        id: check-version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package name: $PKG_NAME"
          echo "Package version: $PKG_VERSION"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package tarball and consumer installation
        run: |
          TARBALL=$(npm pack)
          echo "Generated tarball: $TARBALL"
          tar -ztvf "$TARBALL"
          if tar -ztvf "$TARBALL" | grep -E '(\.env|tests/|session|\.key|\.crt)'; then
            echo "Error: Sensitive or test files found in tarball!"
            exit 1
          fi
          CONSUMER_DIR=$(mktemp -d)
          cd "$CONSUMER_DIR"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          npx bisectpilot --help
          npx bisectpilot --version

      - name: Publish to GitHub Packages
        if: github.event.inputs.registry != 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run requested for GitHub Packages. Executing npm publish --dry-run..."
            npm publish --dry-run
          else
            echo "Publishing to GitHub Packages..."
            npm publish
          fi

      - name: Publish to npm Registry
        if: github.event.inputs.registry == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run requested for npm. Executing npm publish --dry-run..."
            npm publish --registry=https://registry.npmjs.org --provenance --access public --dry-run
          else
            echo "Publishing to npm registry with provenance..."
            npm publish --registry=https://registry.npmjs.org --provenance --access public
          fi
